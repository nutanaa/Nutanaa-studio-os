[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nutanaa-studio-os"
version = "0.1.0"
description = "Python project foundation for Nutanaa Studio OS"
requires-python = ">=3.12"
dependencies = ["psutil>=5.9.0"]

[tool.hatch.build.targets.wheel]
packages = []

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
